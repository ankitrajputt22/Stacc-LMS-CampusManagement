# Checks every change to Stacc: the backend tests, the frontend lint, unit tests, and build, and the AI service lint and tests.
# None of them needs a model or any secret; the backend's MySQL tests start their own throwaway MySQL container with
# Docker, which GitHub's runners provide. See docs/continuous-integration.md and docs/testing.md.
name: CI

on:
  push:
    branches:
      - development
      - main
      - "v*-phase-*"
  pull_request:
    branches:
      - development
      - main
  workflow_dispatch:

# Only read access is needed; the workflow never writes to the repository.
permissions:
  contents: read

# A newer push to the same branch cancels the older, still-running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test
        run: mvn -B -ntp verify

      # Without Docker the MySQL tests skip themselves. CI has Docker, so here they must really have run.
      - name: Check that the MySQL tests ran
        run: |
          summary=target/failsafe-reports/failsafe-summary.xml
          completed=$(sed -n 's:.*<completed>\([0-9]*\)</completed>.*:\1:p' "$summary")
          skipped=$(sed -n 's:.*<skipped>\([0-9]*\)</skipped>.*:\1:p' "$summary")
          echo "MySQL tests run: ${completed:-0}, skipped: ${skipped:-0}"
          if [ "${completed:-0}" -eq 0 ] || [ "${skipped:-0}" -ne 0 ]; then
            echo "::error::The MySQL tests did not all run."
            exit 1
          fi

      # Names each failed test and its message on the run's summary page, so a failure can be read at a glance.
      - name: List failed tests
        if: failure()
        run: |
          python3 - <<'EOF'
          import glob
          import xml.etree.ElementTree as ElementTree

          for report in glob.glob("target/surefire-reports/TEST-*.xml") + glob.glob("target/failsafe-reports/TEST-*.xml"):
              for case in ElementTree.parse(report).getroot().iter("testcase"):
                  for problem in list(case.findall("failure")) + list(case.findall("error")):
                      text = (problem.get("message") or problem.text or "").strip()[:900]
                      text = text.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
                      print(f"::error title={case.get('classname')}.{case.get('name')}::{text}")
          EOF

      - name: Keep test reports when tests fail
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
          retention-days: 7

  frontend:
    name: Frontend lint, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Type check and build
        run: npm run build
        env:
          # A public placeholder, only so the build has an API address. It is not a secret.
          VITE_API_BASE_URL: http://localhost:8080/api

  ai-service:
    name: AI service lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ai-service/requirements.txt
            ai-service/requirements-dev.txt

      - name: Install the dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check .

      - name: Test
        run: python -m pytest -q

  e2e:
    name: End-to-end tests
    # Only after the faster checks pass, since this one builds and starts the whole stack.
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install the locked dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Start the stack with the demo data
        run: ./stack.sh up

      - name: Run the journeys
        run: npm test

      - name: Keep the backend log when something fails
        if: failure()
        run: ./stack.sh logs backend > backend.log 2>&1 || true

      - name: Keep the report, traces, and log when something fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
            e2e/backend.log
          retention-days: 7

      - name: Stop the stack
        if: always()
        run: ./stack.sh down
