# Security headers for every page and file this server sends. Included at the server level and again in each location
# that sets its own headers, because Nginx drops server-level add_header lines in a location that has its own.
# The camera is allowed only for this site (the gate's QR scan); the page loads scripts, styles, and data only from
# itself. Inline styles stay allowed for maths rendering (KaTeX).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
