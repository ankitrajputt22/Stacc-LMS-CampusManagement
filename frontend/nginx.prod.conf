# Production: HTTPS only. Port 80 only redirects to HTTPS; certificates come from the host folder mounted at
# /etc/nginx/tls (fullchain.pem and privkey.pem), for example from Let's Encrypt. Used by compose.prod.yaml.
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Redirects stay relative. Nginx listens on port 80 inside the container but is reached on
    # another port from outside, so a redirect with a full address would point at the wrong port.
    absolute_redirect off;

    # Docker's own DNS. Looking the backend up per request, through the variable below, means
    # Nginx starts even if the backend is not up yet and keeps working after it is recreated.
    resolver 127.0.0.11 valid=10s;

    # Assignment submissions may carry up to three files of 25 MB, so only this route accepts that much.
    # It is otherwise passed on exactly like the other API calls below.
    location ~ ^/api/v1/lms/courses/[0-9]+/assignments/[0-9]+/submissions$ {
        client_max_body_size 80m;

        set $stacc_backend http://backend:8080;
        proxy_pass $stacc_backend;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Nginx's own ID for this request, which the backend keeps, puts in its logs, and returns as X-Request-ID.
        proxy_set_header X-Request-ID $request_id;
    }

    # AI learning routes may wait for a local model: a knowledge refresh up to the backend's 15 minutes, an answer up
    # to 2 minutes. Only the waiting time differs; they are passed on like every other API call. The AI service itself
    # is internal and never reachable through this server.
    location ~ ^/api/v1/lms/(faculty/)?courses/[0-9]+/ai/ {
        proxy_read_timeout 960s;
        proxy_send_timeout 960s;

        set $stacc_backend http://backend:8080;
        proxy_pass $stacc_backend;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Nginx's own ID for this request, which the backend keeps, puts in its logs, and returns as X-Request-ID.
        proxy_set_header X-Request-ID $request_id;
    }

    # API calls go to the backend unchanged. There is no path after the address on purpose:
    # that is what keeps the /api prefix (and the version after it, /api/v1), which the backend routes expect.
    location /api/ {
        # Study-material uploads may be up to 25 MB. This lets a full-size upload through with its
        # form fields; the backend checks the file itself and has the final say.
        client_max_body_size 26m;

        set $stacc_backend http://backend:8080;
        proxy_pass $stacc_backend;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Nginx's own ID for this request, which the backend keeps, puts in its logs, and returns as X-Request-ID.
        proxy_set_header X-Request-ID $request_id;
    }

    # Built files have a hash in their name, so browsers may keep them for a long time.
    # A file that does not exist is a real 404, not the app.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # The page itself is always checked for a newer version, so a rebuild shows up at once.
    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Everything else is either a real file or a page inside the app. React Router handles
    # pages in the browser, so an unknown path gets the app instead of an Nginx 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
