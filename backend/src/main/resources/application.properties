spring.application.name=stacc-backend

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:stacc}
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

stacc.jwt.secret=${JWT_SECRET}
# A sign-in lasts at most this long, and ends earlier after this long without a request (see docs/authentication.md).
stacc.session.max-duration=${STACC_SESSION_MAX_DURATION:12h}
stacc.session.idle-timeout=${STACC_SESSION_IDLE_TIMEOUT:2h}
# Send the session cookie over HTTPS only. Must be true wherever Stacc is served over HTTPS (prod requires it).
stacc.session.secure-cookie=${STACC_SESSION_SECURE_COOKIE:false}
# Failed sign-ins slow down further tries per login ID and per address (see docs/authentication.md). Accounts are
# never locked. Trust the proxy's X-Real-IP header only behind Stacc's own proxy.
stacc.sign-in.account-threshold=${STACC_SIGN_IN_ACCOUNT_THRESHOLD:5}
stacc.sign-in.address-threshold=${STACC_SIGN_IN_ADDRESS_THRESHOLD:30}
stacc.sign-in.window=${STACC_SIGN_IN_WINDOW:15m}
stacc.sign-in.base-delay=${STACC_SIGN_IN_BASE_DELAY:30s}
stacc.sign-in.max-delay=${STACC_SIGN_IN_MAX_DELAY:15m}
stacc.sign-in.trust-proxy=${STACC_SIGN_IN_TRUST_PROXY:false}

# Web addresses that may call the API from a browser, separated by commas. The default is the
# frontend dev server. Exact origins only; a wildcard is refused at startup.
stacc.cors.allowed-origins=${FRONTEND_ORIGIN:http://localhost:5173}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Private object storage for study-material files (MinIO in development). The credentials have no
# defaults and must come from the environment. See docs/docker.md.
stacc.storage.endpoint=${STACC_STORAGE_ENDPOINT:http://localhost:9000}
stacc.storage.access-key=${STACC_STORAGE_ACCESS_KEY:}
stacc.storage.secret-key=${STACC_STORAGE_SECRET_KEY:}
stacc.storage.bucket=${STACC_STORAGE_BUCKET:stacc-materials}

# The largest file, for study materials and assignment submissions alike, checked by the services with
# a clear message.
stacc.materials.max-file-size=${STACC_MATERIAL_MAX_FILE_SIZE:25MB}
# The most files in one assignment submission attempt.
stacc.submissions.max-files=${STACC_SUBMISSION_MAX_FILES:3}
# Spring's own upload limit is a hard stop above what the services allow: one submission attempt can carry
# three files of 25 MB and its text. Every file below it is still read and checked against the file limit
# above, with a clear message; anything larger is refused before it is read. The Docker proxy allows
# 80 MB for submissions and 26 MB for every other request (frontend/nginx.conf).
spring.servlet.multipart.max-file-size=${STACC_UPLOAD_MAX_REQUEST_SIZE:80MB}
spring.servlet.multipart.max-request-size=${STACC_UPLOAD_MAX_REQUEST_SIZE:80MB}

# AI learning features (docs/ai-learning.md). Off unless AI_ENABLED=true; then the internal AI service's address and the
# shared internal token (at least 32 characters, the same value the AI service has) must be set. The backend is the only
# client of the AI service and never sends it a user's access token.
stacc.ai.enabled=${AI_ENABLED:false}
stacc.ai.service-url=${AI_SERVICE_URL:http://localhost:8095}
stacc.ai.internal-token=${STACC_AI_INTERNAL_TOKEN:}
stacc.ai.connect-timeout=${AI_CONNECT_TIMEOUT:3s}
stacc.ai.read-timeout=${AI_READ_TIMEOUT:120s}
stacc.ai.sync-read-timeout=${AI_SYNC_READ_TIMEOUT:15m}
stacc.ai.max-sync-sources=${AI_MAX_SYNC_SOURCES:100}
stacc.ai.max-sync-bytes=${AI_MAX_SYNC_BYTES:40MB}
stacc.ai.building-timeout=${AI_BUILDING_TIMEOUT:30m}

# Health checks (Spring Boot Actuator). Only the health endpoint is exposed, at /actuator/health, outside /api: Nginx
# never passes it to browsers, and the backend's own port is bound to this machine only. It shows each part's status
# (db, storage, aiService) but never details such as addresses. Readiness, used by Docker, needs only the database;
# liveness only that the process runs. See docs/operations.md.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=always
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db

# Every log line written while handling a request carries that request's ID (see RequestIdFilter).
logging.pattern.correlation=[%X{requestId:-}]\u0020
