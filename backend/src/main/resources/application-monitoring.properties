# The "monitoring" profile (v0.16.7): Actuator moves to an internal management port, where Prometheus may read
# metrics. Inside Docker this port is reached only by the monitoring profile's Prometheus service; it is never
# published and never proxied by Nginx. Health stays on the main port at /livez and /readyz.
management.server.port=8081
management.endpoints.web.exposure.include=health,prometheus
management.metrics.tags.application=stacc-backend
