spring.datasource.url=jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:3306}/${MYSQL_DATABASE}

stacc.storage.endpoint=${STACC_STORAGE_ENDPOINT}

stacc.session.secure-cookie=${STACC_SESSION_SECURE_COOKIE:true}

stacc.cors.allowed-origins=${FRONTEND_ORIGIN:}

springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:false}

logging.structured.format.console=ecs
logging.level.root=INFO

server.error.include-stacktrace=never
server.error.include-message=never
