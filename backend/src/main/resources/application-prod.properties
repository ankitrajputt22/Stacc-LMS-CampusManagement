# Production settings, used with SPRING_PROFILES_ACTIVE=prod on top of application.properties.
# Everything a real deployment must decide is required here: there are no localhost defaults to fall back on, so a
# missing value stops the start-up instead of quietly pointing at the wrong place. ProductionSettingsCheck refuses
# unsafe combinations as well. Every variable is described in docs/configuration.md.

# The database: host and name have no default.
spring.datasource.url=jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:3306}/${MYSQL_DATABASE}

# File storage: the address has no default, and the access keys must be set (checked at start-up).
stacc.storage.endpoint=${STACC_STORAGE_ENDPOINT}

# Browser calls from another origin: none unless listed. A same-origin frontend behind Nginx needs none.
stacc.cors.allowed-origins=${FRONTEND_ORIGIN:}

# The API description and its web page are for development; switch them on deliberately if a deployment needs them.
springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:false}

# One JSON object per log line (Elastic Common Schema), ready for a log store; the request ID is included.
logging.structured.format.console=ecs
logging.level.root=INFO

# Never send internal details with an error; the shared handler already writes safe bodies.
server.error.include-stacktrace=never
server.error.include-message=never
